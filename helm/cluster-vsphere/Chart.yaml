apiVersion: v2
name: cluster-vsphere
description: A helm chart for creating Cluster API clusters with the vSphere provider (CAPV).
version: 9.0.0
home: https://github.com/giantswarm/cluster-vsphere
icon: https://s.giantswarm.io/app-icons/vsphere/2/icon-light.png
sources:
  - https://github.com/giantswarm/cluster-vsphere
maintainers:
  - name: Team Rocket
    email: team-rocket@giantswarm.io
keywords:
  - capv
  - vsphere
annotations:
  application.giantswarm.io/app-type: cluster
  application.giantswarm.io/team: rocket
restrictions:
  compatibleProviders:
    - vsphere
dependencies:
  - repository: https://giantswarm.github.io/cluster-catalog
    name: cluster
    version: 8.0.0
