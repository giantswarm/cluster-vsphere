{{/* vSphere-specific cilium Helm values*/}}
{{/* https://github.com/giantswarm/cilium-app/blob/main/helm/cilium/values.yaml */}}
{{- define "vSphereCiliumHelmValues" }}
certgen:
  # The certs job has to run while nodes still carry both uninitialized taints
  # (cloudprovider and cluster-api), because the CPI that clears the first one
  # waits for this HelmRelease to become ready.
  tolerations:
  - operator: "Exists"
hubble:
  relay:
    tolerations:
    - key: "node-role.kubernetes.io/master"
      effect: "NoSchedule"
      operator: "Exists"
    - key: "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"
      operator: "Exists"
    - key: "node.cloudprovider.kubernetes.io/uninitialized"
      effect: "NoSchedule"
      operator: "Equal"
      value: "true"
  ui:
    tolerations:
    - key: "node-role.kubernetes.io/master"
      effect: "NoSchedule"
      operator: "Exists"
    - key: "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"
      operator: "Exists"
    - key: "node.cloudprovider.kubernetes.io/uninitialized"
      effect: "NoSchedule"
      operator: "Equal"
      value: "true"
{{- end }}
