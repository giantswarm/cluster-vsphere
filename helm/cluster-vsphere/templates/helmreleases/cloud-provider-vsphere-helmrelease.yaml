apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ include "resource.default.name" . }}-cloud-provider-vsphere
  namespace: {{ .Release.Namespace }}
  annotations:
    cluster.giantswarm.io/description: {{ .Values.global.metadata.description | quote }}
  labels:
    cluster-apps-operator.giantswarm.io/watching: ""
    {{- include "labels.common" . | nindent 4 }}
spec:
  {{- $_ := set $ "appName" "cloud-provider-vsphere" }}
  url: oci://gsoci.azurecr.io/charts/giantswarm/cloud-provider-vsphere
  ref:
    tag: {{ include "cluster.app.version" . }}
  interval: 24h
  timeout: 60s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "resource.default.name" . }}-cloud-provider-vsphere
  namespace: {{ .Release.Namespace }}
  annotations:
    cluster.giantswarm.io/description: {{ .Values.global.metadata.description | quote }}
  labels:
    cluster-apps-operator.giantswarm.io/watching: ""
    giantswarm.io/service-priority: {{ .Values.global.metadata.servicePriority }}
    {{- include "labels.common" . | nindent 4 }}
spec:
  releaseName: cloud-provider-vsphere
  targetNamespace: kube-system
  storageNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: {{ include "resource.default.name" . }}-cloud-provider-vsphere
  dependsOn:
  - name: {{ include "resource.default.name" . }}-cilium
    namespace: {{ .Release.Namespace }}
  kubeConfig:
    secretRef:
      name: {{ include "resource.default.name" . }}-kubeconfig
  interval: {{ (((.Values.internal).helmReleases).cpi).interval | default "5m" }}
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
  - kind: Secret
    name: {{ include "credentialSecretName" . }}
    valuesKey: username
    targetPath: config.username
  - kind: Secret
    name: {{ include "credentialSecretName" . }}
    valuesKey: escapedPassword
    targetPath: config.password
  values:
    config:
      enabled: true
      vcenter: {{ .Values.global.providerSpecific.vcenter.server | quote }}
      datacenter: {{ .Values.global.providerSpecific.vcenter.datacenter | quote }}
      region: {{ .Values.global.providerSpecific.vcenter.region | quote }}
      zone: {{ .Values.global.providerSpecific.vcenter.zone | quote }}
      thumbprint: {{ .Values.global.providerSpecific.vcenter.thumbprint }}
    {{- if eq .Values.cluster.providerIntegration.resourcesApi.controlPlaneResource.provider "kamaji" }}
    kamaji:
      enabled: true
    daemonset:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      tolerations:
      - effect: NoExecute
        operator: Exists
      - effect: NoSchedule
        operator: Exists
    {{- end }}
